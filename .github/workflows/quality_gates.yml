name: Quality gates

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]
    branches:
      - dev
      - automatedQA
      - manualQA
      - staging
      - main
      - prod

permissions:
  contents: read
  pull-requests: read

jobs:
  promotion-order:
    name: Enforce promotion order
    runs-on: ubuntu-latest
    steps:
      - name: Validate source and target branches
        env:
          BASE: ${{ github.base_ref }}
          HEAD: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          case "$BASE" in
            dev)
              if [[ ! "$HEAD" =~ ^[a-z0-9]+(_[a-z0-9]+)*_[a-z0-9]+_[a-z0-9]+$ ]]; then
                echo "Feature branches must use snake_case and end in specialist_making_change."
                exit 1
              fi
              ;;
            automatedQA) [[ "$HEAD" == "dev" ]] ;;
            manualQA) [[ "$HEAD" == "automatedQA" ]] ;;
            staging) [[ "$HEAD" == "manualQA" ]] ;;
            main) [[ "$HEAD" == "staging" ]] ;;
            prod) [[ "$HEAD" == "main" ]] ;;
            *) echo "Unsupported protected-branch target: $BASE"; exit 1 ;;
          esac

  review-evidence:
    name: Verify current-SHA specialist evidence
    runs-on: ubuntu-latest
    steps:
      - name: Require two independent current-SHA reviews
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          node <<'NODE'
          const body = process.env.PR_BODY || "";
          const head = process.env.HEAD_SHA;
          const base = process.env.BASE_SHA;
          const reviewPattern = /- Reviewer identity:[^\n]*\n- Reviewer role:[^\n]*\n- Tribe:[^\n]*\n- Reviewed source commit SHA:\s*([^\n]+)\n- Reviewed target commit SHA:\s*([^\n]+)\n- Reviewed at:[^\n]*\n- Decision:\s*(Approved(?: with comments)?)/gim;
          const valid = [...body.matchAll(reviewPattern)]
            .filter(([, source, target]) => source.trim() === head && target.trim() === base);
          const roles = new Set(valid.map(match => match[0].match(/- Reviewer role:\s*([^\n]+)/i)?.[1]?.trim()).filter(Boolean));
          if (valid.length < 2 || roles.size < 2) {
            console.error("PR body must contain two independent approved specialist-review blocks bound to the current source and target SHAs.");
            process.exit(1);
          }
          NODE

  test:
    name: Install and test
    runs-on: ubuntu-latest
    needs: [promotion-order, review-evidence]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test
